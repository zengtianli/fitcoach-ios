name: fitcoach-ios
name_en: At-Home Sports
name_zh: 上门体育
display_name: At-Home Sports · 上门体育
family: fitcoach
form: ios
platforms: [iphone, ipad, mac, watch, vision]   # 一个 App 五个平台（用户 2026-10-02）；须与 sop.platforms 一致，multiplatform.py audit 与 project.yml 对账
lifecycle: active
bundle_id: cyou.tianli.fitcoachapp
origin: own
sop:
  account:
    mode: password
    rationale: 保留教练邮箱密码账号；已验证手机号用于注册、验证码登录、绑定换绑与找回，业务归属保持原 coach_id。邮箱密码登录本身不宣称邮箱验证或真实邮件闭环。
    verification_channels: [phone]
    phone_login: true
    inputs: [../../service/account_phone.py, ../../service/tenancy.py, ../../service/api.py, ../../service/schema.sql]
  test: bash ref/run
  cli:
    commands:
    - fitcoach
    app: cyou.tianli.fitcoachapp
  # 界面功能对照（写法见 app 技能 references/agent-cli.md）：从 Sources/*View.swift、Shared/AppLifecycleMobile.swift、
  # Watch/ 逐项列出。手机、平板、Vision、手表上没法装命令行，都用 Mac 包里那份 fitcoach 打同一套后端来对应。
  # human 项都列在 fitcoach --help 的「仅在窗口中」里（cli/test_cli.py 核对）。「记住账号和密码」2026-10-07 改记 device，
  # 帮助里仍把它列在「仅在窗口中」（帮助在 Mac 包里，这一轮不改）。
  # 本机登录态（记住的账号密码、退出登录）：手机、平板、Vision 上的那份只在设备本机，记 device；Mac 版就装在本机，它那份在
  # 这台 Mac 上，够得着，另列「（Mac 版）」：2026-10-07 起由 fitcoach config / update / app 转调 Mac 版 App 的可执行文件（装机版 1.0.1 (65) 起有）；装机版上只读验证跑通的记 command，没跑通的留 missing（与「配置与更新」面板同一口径，不让 device 盖住够得着的缺口）。
  agent_cli:
    readback: fitcoach status
    features:
    # ── 登录页
    - name: 教练登录（邮箱与密码）
      command: fitcoach login
    - name: 记住账号和密码
      device: 记住的账号密码存在那台设备上 App 自己的钥匙串里，属性是仅限本设备（不随 iCloud 钥匙串走），设备不上报，命令与后端读不到也改不了；命令行凭证由 fitcoach login 另存一份，两边互不读取。范围是手机、平板、Vision；Mac 版另列
    - name: 记住账号和密码（Mac 版）
      # 读回 app saved-login status（只有服务器与账号名，不带密码）；清除 app saved-login clear --yes [--all]。由 Mac 版 App 自己的可执行文件读写它的钥匙串
      command: fitcoach app saved-login
    - name: 邮箱注册
      command: fitcoach register
    - name: 短信登录
      command: fitcoach phone
    - name: 手机注册
      command: fitcoach phone
    - name: 忘记密码（手机号找回）
      command: fitcoach phone
    - name: 获取验证码与填写短信验证码
      command: fitcoach phone
    - name: 保存账号恢复密钥
      command: fitcoach phone
    - name: 学员查看（粘贴教练发来的链接或口令）
      command: fitcoach student-view
    - name: 进入已登录的教练端 / 学员端、切换账号
      human: 只是切换这个窗口显示教练端还是学员端；命令行两端各有命令，不需要切换
    - name: 服务器设置（查看与修改服务器地址）
      # 看：config status / config export -o -（values 里的 defaults.fitcoach.baseURL）；改：改导出文件里的这一项再 config import FILE --yes。
      # 命令行自己连哪台仍用 --base 或 FITCOACH_BASE，这三组命令不接受 --base
      command: fitcoach config import
    - name: 隐私政策、联系支持
      human: 打开网页，只在窗口里有意义
    # ── 日程
    - name: 日程（今天 / 本周 / 过时）
      command: fitcoach schedule
    - name: 前一天、后一天、回到今天
      command: fitcoach schedule
    - name: 提醒（预警条）
      command: fitcoach schedule
    - name: 排课
      command: fitcoach sessions
    - name: 排课表单的可选项（学员、课包、地点、当日可排）
      command: fitcoach sessions
    - name: 改课
      command: fitcoach sessions
    - name: 改状态（已上课 / 未到 / 已取消，理由与强制覆盖）
      command: fitcoach sessions
    - name: 查看这一节的变更记录
      command: fitcoach sessions
    - name: 课时余额（宽屏日程右栏）
      command: fitcoach students
    - name: 下拉刷新与刷新按钮
      human: 只是让窗口重新取数；命令每次都现读，没有缓存可刷
    # ── 学员
    - name: 学员名单（在册 / 已停用）
      command: fitcoach students
    - name: 找学员
      command: fitcoach students
    - name: 新学员
      command: fitcoach students
    - name: 学员详情（合计、课包、课次）
      command: fitcoach students
    - name: 改资料（姓名、备注、在册）
      command: fitcoach students
    - name: 签发学员链接
      command: fitcoach students
    - name: 看链接 / 隐藏
      command: fitcoach students
    - name: 复制学员链接
      human: 写系统剪贴板，只在窗口里有意义；命令行用 students link ID --reveal 输出到 stdout
    - name: 分享学员链接
      human: 系统分享面板，要真人选去向
    - name: 到登录页验证链接
      command: fitcoach student-view
    - name: 加课包
      command: fitcoach packages
    - name: 改课包
      command: fitcoach packages
    - name: 作废 / 撤销作废课包
      command: fitcoach packages
    - name: 成长数据（首测、最新、最好、变化、到课率）
      command: fitcoach growth
    - name: 趋势图
      human: 图形只在窗口里；每个数据点在 fitcoach growth 的 series 里
    - name: 每次测量
      command: fitcoach growth
    - name: 录体测成绩
      command: fitcoach measurements
    - name: 删除一条测量
      command: fitcoach measurements
    - name: 这个学员的变更记录
      command: fitcoach audit
    # ── 档期
    - name: 档期（每周规则 / 例外 / 未来两周）
      command: fitcoach availability
    - name: 加每周规则
      command: fitcoach availability
    - name: 删除每周规则
      command: fitcoach availability
    - name: 加例外（停排 / 加开）
      command: fitcoach availability
    - name: 删除例外
      command: fitcoach availability
    # ── 管理
    - name: 体测项目（在用 / 已停用）
      command: fitcoach metrics
    - name: 新项目、改项目、停用项目
      command: fitcoach metrics
    - name: 使用常用项目
      command: fitcoach metrics
    - name: 上课地点（启用中 / 已停用）
      command: fitcoach locations
    - name: 新地点、改地点、停用地点
      command: fitcoach locations
    - name: 变更记录（显示全部、按学员筛选）
      command: fitcoach audit
    # ── 更多
    - name: 快速开始
      command: fitcoach setup
    - name: 手机号与账号安全（当前账号状态）
      command: fitcoach phone
    - name: 绑定手机号、换绑
      command: fitcoach phone
    - name: 手机账号设置登录密码
      command: fitcoach phone
    - name: 修改密码
      command: fitcoach password
    - name: 注销账号
      command: fitcoach account
    - name: 退出登录
      device: App 的登录态就是那台设备本机偏好里的会话 Cookie（fitcoach.coachCookie），退出只清本机这一份，不请求服务端，服务端也不留会话记录，设备不上报；fitcoach logout 删的是命令行自己那份凭证，两边互不读取，够不到设备里那份。范围是手机、平板、Vision；Mac 版另列
    - name: 退出登录（Mac 版）
      # 清 Mac 版 App 自己的教练登录态（须 --yes）；fitcoach logout 只删命令行自己的凭证，是另一份
      command: fitcoach app logout
    # 共享生命周期界面（Shared/AppLifecycleMobile.swift「配置与更新」）：命令层由共享模块统一做，本组件不各自实现。
    # 手机、平板、Vision 上的那份只在设备本机，记 device；Mac 版就装在本机（fitcoach 所在的那个 App），
    # 同一面板的状态在这台 Mac 上，够得着但还没有命令，另列为 missing。
    - name: 使用 iCloud 记住配置
      device: 手机、平板、Vision 上「配置与更新」面板里的开关，存在那台设备的本机偏好里，设备不上报；命令与后端够不到
    - name: 导出配置
      device: 手机、平板、Vision 上导出的是那台设备的本机偏好，经设备上的系统文件面板存到本人选的位置；命令与后端读不到设备里那份
    - name: 导入配置
      device: 手机、平板、Vision 上写的是那台设备的本机偏好，文件经设备上的系统文件面板选取；命令与后端写不到设备里那份
    - name: 检查更新
      device: 手机、平板、Vision 上拿本机已装版本去比 App Store 上的版本，结论只显示在那台设备上，不留存也不上报；命令与后端读不到
    - name: 升级到新版
      device: 手机、平板、Vision 上是「前往 App Store」，由系统在那台设备上安装；命令与后端替它装不了
    - name: 使用 iCloud 记住配置（Mac 版）
      command: fitcoach config sync
    - name: 导出配置（Mac 版）
      command: fitcoach config export
    - name: 导入配置（Mac 版）
      command: fitcoach config import
    - name: 检查更新（Mac 版）
      missing: 命令已在装机版里（fitcoach update check），但这台 Mac 的 App 还没有被授权读 iCloud Drive 更新目录：装机版上实跑返回 check_incomplete「请先选择 iCloud Drive 更新目录」，读到发行记录这一步没有跑通（隔离测试里读得到）。授权要真人在「配置与更新」面板里用系统文件选择器选一次目录（见下一行 human）；选过后 fitcoach update check --json 读到发行记录，即改记 command（fitcoach update check）
    - name: 升级到新版（Mac 版）
      missing: 命令已在装机版里（fitcoach update install；沙盒包不自行替换：命令核对发行包身份、大小与 SHA256 后给出发行包位置，替换由安装脚本完成，与面板「打开发行包」做到同一步）。但它先要读发行记录，这台 Mac 的 App 还没有被授权读 iCloud Drive 更新目录：装机版上 --dry-run 与缺 --yes 都返回 check_incomplete，只有错参数退出 2 跑通。真人在面板里选过更新目录后，update install --dry-run / 缺 --yes 跑通，即改记 command（fitcoach update install）
    - name: 选择 iCloud Drive 更新目录
      human: Mac 版的系统文件选择器授权（沙盒目录授权只认真人在选择器里点选）
    # ── 学员端
    - name: 学员端（剩余课时、下一节课、训练成果、课包、已取消的预约、上课记录）
      command: fitcoach student-view
    # ── 手表（只读，数据由 iPhone 递过去）
    - name: 手表今天的课与下一节
      command: fitcoach schedule
    - name: 手表课时余额
      command: fitcoach students
    - name: 手表一节详情
      command: fitcoach sessions
    - name: 表盘复杂功能「下一节」
      command: fitcoach schedule
    - name: 手表快照的更新时间与过期提示
      device: 快照由 iPhone 生成后递给手表，存在手表本机钥匙串里，不跨设备也不上报；它的生成时间和是否过期只在那块手表上，命令与后端读不到
  accept:
    functionality: bash scripts/accept/functionality.sh
    recovery: bash scripts/accept/recovery.sh
    privacy: bash scripts/accept/privacy.sh
    # 平台线启动冒烟：iPhone / iPad / Mac / Vision 先起隔离演示后端（scripts/demo/coach_day.py：真后端、127.0.0.1
    # 随机端口、临时库、seed.py 假数据 + 今天 4 节课）；手表不联网，用 -fitcoach.watchDemo 1 的占位快照。
    # 再交给 Chapter 内置 platform_launch（共享 sim_lane：仓外构建、无界面模拟器 / Mac 静默启动不上屏、截图）。
    launch_iphone: bash scripts/accept/launch.sh iphone
    launch_ipad: bash scripts/accept/launch.sh ipad
    launch_mac: bash scripts/accept/launch.sh mac
    launch_watch: bash scripts/accept/launch.sh watch
    launch_vision: bash scripts/accept/launch.sh vision
  ui:
  - Sources/**
  - Shared/**
  - Watch/**
  - WatchWidget/**
  source:
  - Sources/**
  - Shared/**
  - Resources/**
  - Widget/**
  # 手表 app 与表盘复杂功能随 iOS 包嵌入（FitCoach.app/Watch/）；Mac/Vision 按各自实际 target 用 replace 输入。
  - Watch/**
  - WatchWidget/**
  - ShareExtension/**
  - project.yml
  - '*.entitlements'
  - cli/**
  test_inputs:
  - Tests/**
  - ref/*.swift
  - ref/run
  - ref/stub_broken_ui.py
  - test-contract.py
  - test_check_markdown_drift.py
  - scripts/tests/**
  - scripts/accept/**
  - scripts/demo/**
  - cli/test.sh
  - cli/test_cli.py
  - Package.swift
  media:
  - shots
  release: perf/asc-release.json
  # 一个 App 五条平台线（用户 2026-10-02：同名、同图标、同数据；「我都有，但你用模拟器好了」）。
  # 模拟器验收、证据标 environment=simulator；Mac 线是本组件自己的 macOS 目的地（本机原生、静默）。手表 / Vision / Mac
  # 还没上架（distribution: none）。资源门按原 app skill 五平台标准：缺省→产品→本线预算；
  # memory_mb / cpu / size_mb / cold_launch_ms 均为硬门，缺测或超限不通过。
  platforms:
    iphone:
      input_normalization: {proof: perf/input-normalizations/finder-iphone.json, sha256: 6a8488527a6dff441a5e58c04a169ab2494a48dcc12c0fa333571bfa70a05a34}
      simulator: {device_type: iPhone-17-Pro}
      store_shots: shots/appstore/iphone/*.png
      distribution: app_store
    ipad:
      input_normalization: {proof: perf/input-normalizations/finder-ipad.json, sha256: 4a56bbe8cf04b6430050a0f1d1632d2a91c8dceda124de71864ddfb6d0ec4193}
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      store_shots: shots/appstore/ipad/*.png
      distribution: app_store
    mac:
      input_normalization: {proof: perf/input-normalizations/finder-mac.json, sha256: 932492222d1da66ecb8d462061bdffb66e21c6275d1e634a8d312e10e540437e}
      source_mode: replace
      source: [Sources/**, Shared/PlatformCompat.swift, Shared/LaneSignal.swift, Shared/AppLifecycle.swift, Shared/AppConfiguration.swift, Shared/AppLifecycleMobile.swift, Resources/Assets.xcassets/**, project.yml, Mac.entitlements, cli/*.swift]
      # 不登记商店截图：Mac 不发行、不上推广页；静默线的进程内离屏渲染画不出侧栏选中材质（选中行成黑块），
      # 上屏窗口截图又不许自动化做（不上屏、不进 Dock）。Mac 上架前由本人决定怎么截。
      distribution: none
    watch:
      input_normalization: {proof: perf/input-normalizations/finder-watch.json, sha256: bb2ea22b27ca985664b813490ae7e10c80dd04afbe014c93b83d6e6bc4e81f0b}
      scheme: FitCoachWatch
      bundle_id: cyou.tianli.fitcoachapp.watchkitapp
      source: [Watch/**, WatchWidget/**]
      simulator: {device_type: Apple-Watch-Series-12-46mm}
      launch_args: [-fitcoach.watchDemo, '1']
      store_shots: shots/appstore/watch/*.png
      budget: {memory_mb: 25, cpu: 0.5, size_mb: 10, cold_launch_ms: 1500}
      distribution: none
    vision:
      input_normalization: {proof: perf/input-normalizations/finder-vision.json, sha256: 12258be953aab1689d90c89b47605b9552a4225ec06bc39506097f8440e2af00}
      source_mode: replace
      source: [Sources/**, Shared/PlatformCompat.swift, Shared/LaneSignal.swift, Shared/AppLifecycle.swift, Shared/AppConfiguration.swift, Shared/AppLifecycleMobile.swift, Resources/Assets.xcassets/**, project.yml]
      simulator: {device_type: Apple-Vision-Pro-4K}
      store_shots: shots/appstore/vision/*.png
      budget: {memory_mb: 60, cpu: 0.5}
      distribution: none
  measure:  # 模拟器无界面、不抢焦点；Mac 线静默（不上屏、不进 Dock），本人用电脑时也能测
    # 起隔离演示后端 → 逐线共享测量；iPhone 同一原件投影到 simulator/lightweight，不再另测 legacy。
    # 核当前输入与原件 SHA 后复用；锁/负载等待 0，忙或预算耗尽即返回 75，下个时段只补缺口。
    command: ~/Dev/.venv/bin/python scripts/perf/measure_platforms.py
    platform_env: SOP_PERF_PLATFORM  # 原薄入口以此作为 --only 默认值；显式 CLI 优先。
    outputs: [perf/simulator.json, perf/lightweight.json, perf/raw, perf/platforms, perf/projections]
    in_use: true
  runtime_note: 平台线模式（2026-10-02）：五条线都按模拟器验收（Mac 线本机原生），实体 iPhone 不回读、真机未验证；ASC 回读只核对已上传的 iOS 构建。
  runtime:
    kind: ios
    readback: builtin:asc-device
  test_extra_files:
  - /Users/tianli/Apps/fitcoach/service/api.py
  - /Users/tianli/Apps/fitcoach/service/db.py
  - /Users/tianli/Apps/fitcoach/service/domain.py
  - /Users/tianli/Apps/fitcoach/service/ratelimit.py
  - /Users/tianli/Apps/fitcoach/service/tenancy.py
  - /Users/tianli/Apps/fitcoach/service/schema.sql
  - /Users/tianli/Apps/fitcoach/service/requirements.txt
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/fitcoach-ios
    rationale: 排课、课时与学员进步，随手就能看清。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
