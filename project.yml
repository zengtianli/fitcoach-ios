name: FitCoach
options:
  bundleIdPrefix: cyou.tianli
  # visionOS 26：Vision Pro 与 iPhone / iPad / Mac 是同一个 FitCoach target（成长小金库同款，2026-10-02）。
  # watchOS 11：手表 app 与表盘复杂功能是独立 target（文件末尾；xcodegen 不许 watchOS 进 supportedDestinations）。
  deploymentTarget: { iOS: "18.0", macOS: "15.0", visionOS: "26.0", watchOS: "11.0" }
  createIntermediateGroups: true
settings:
  base:
    # 版本号放工程级：iPhone 包与内嵌的手表 app、复杂功能必须同一个版本（App Store 拒收不一致的包）
    MARKETING_VERSION: "1.0.1"
    CODE_SIGN_STYLE: Automatic
    # 2026-08-29 起已开通付费 Developer Program(团队 B9LJH93LA4),不再留空走免费 Personal Team。
    DEVELOPMENT_TEAM: B9LJH93LA4
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "5.0"
targets:
  FitCoach:
    type: application
    # iPhone / iPad / Mac / Vision Pro 是同一个 target（同名、同图标、同 bundle id）；
    # Apple Watch 是下面单独的 FitCoachWatch，iOS 构建时嵌进 FitCoach.app/Watch/。
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      # 总部共享：macOS 侧给 iOS-only SwiftUI 修饰符提供同名 no-op，调用点不改（multiplatform.py 注入）
      - path: Shared/PlatformCompat.swift
      # 平台验收车道契约（lane-ready 日志、iPad 横屏、Mac 静默启动与离屏截图）；总部副本，只进 application target
      - path: Shared/LaneSignal.swift
      - path: Shared/AppLifecycle.swift
      - path: Shared/AppConfiguration.swift
      - path: Shared/AppLifecycleMobile.swift
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        # 2026-08-30:原 cyou.tianli.fitcoach 早年被免费 Personal Team(8ZUVJNUK29)签过,
        # 该 ID 已被那个团队注册且免费团队无门户可删 —— 付费团队 B9LJH93LA4 上传时报
        # 「Failed Registering Bundle Identifier ... not available」。换名是唯一低成本解。
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.fitcoachapp
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": Configuration.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=xr*]": Configuration.entitlements
        # ── Mac 侧（multiplatform.py 注入）：沙盒 + 加固运行时是 TestFlight for Mac 的硬门槛；
        #    entitlements 按 sdk 分开给，iOS 的 profile 不认 app-sandbox 这个键。
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Mac.entitlements
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=macosx*]": "$(inherited) APP_LIFECYCLE_KVS"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 上门体育
        # 四方向全给:上 TestFlight 时 App Store Connect 对 universal(iPhone+iPad)app 强制
        # 要求 iPad 分屏四方向不能缺,只给 Portrait 会在上传阶段被拒(2026-08-29 wrong-book 实证)。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 出口合规:声明不使用非豁免加密 → TestFlight 每次传新包不再弹问卷,
        # 直接进 Ready to Test(缺这行则每个 build 都要人去网页点一次)。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "6"
    dependencies:
      # 手表 app 只随 iOS 包走（FitCoach.app/Watch/）；Mac 与 visionOS 包里不带
      - target: FitCoachWatch
        destinationFilters: [iOS]
      # Mac 版把给智能体用的命令行 fitcoach 带进包：Contents/Resources/bin/fitcoach（舰队约定，
      # 由 cli/build.sh --link-app 链到 ~/.local/bin/fitcoach）。只对 macOS 生效：iOS 包与 Xcode Cloud
      # 的 iOS 归档不编、不带这个工具。复制时用 App 自己的身份重签（保留加固运行时）。
      - target: FitCoachCLI
        destinationFilters: [macOS]
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
    scheme:
      testTargets: []
      configVariants: []
  # 命令行 fitcoach：与 App 同一份客户端层（Models / TimeKit / API / QuickSetup）+ cli/*.swift，
  # 与 cli/build.sh 编的是同一批源文件。只在 Mac 上有意义，所以只有 macOS 平台。
  FitCoachCLI:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Models.swift
      - path: Sources/TimeKit.swift
      - path: Sources/API.swift
      - path: Sources/QuickSetup.swift
      - path: cli
        includes: ["*.swift"]
    settings:
      base:
        PRODUCT_NAME: fitcoach
        PRODUCT_MODULE_NAME: FitCoachCLI
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.fitcoachapp.cli
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        OTHER_SWIFT_FLAGS: "-parse-as-library"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        # 工具自己只做临时签名、不申请描述文件；嵌进 App 时随 App 的开发身份重签。
        # 不开沙盒：它从终端被调用，凭证存在 ~/Library/Application Support/FitCoach/cli/（与仓库构建同一处）。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "6"
      configs:
        # Release 编时就剥符号（工具不走 install，SKIP_INSTALL 下默认不剥）：通用二进制 2.7 MB → 约 1.3 MB。
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
  # ── Apple Watch ───────────────────────────────────────────────────────────
  # 教练抬腕看的**只读**一面：今天的课按时间排（时间 / 学员 / 地点 / 剩几节）、学员课时余额，表盘上挂「下一节」。
  # 手表不联网、不拿教练 cookie：iPhone 拉好「今天」经 WatchConnectivity 递过来（Sources/WatchLink.swift →
  # Watch/WatchModel.swift）。快照模型、时区口径与 iPhone 共用同一份文件（WatchSnapshot / TimeKit / Models），不另写。
  # 骨架由 multiplatform.py ensure_watch_target 注入（2026-10-02），界面与数据通路按本产品补齐。
  FitCoachWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: Shared/PlatformCompat.swift
      - path: Shared/LaneSignal.swift
      - path: Sources/WatchSnapshot.swift
      - path: Sources/TimeKit.swift
      # 只为 Vocab 词表（课次状态的中文名）；纯 Foundation，与 iPhone 同一份
      - path: Sources/Models.swift
      # ⚠ 资产目录必须列进来：漏了手表包零报错地没有图标（成长小金库 2026-10-02 实测）；
      #   AppIcon 里那张 platform: watchos 的 1024 只有手表 actool 认。
      - path: Resources/Assets.xcassets
    dependencies:
      - target: FitCoachWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.fitcoachapp.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 上门体育
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cyou.tianli.fitcoachapp
        # 数据只从 iPhone 来：没装 iPhone 版的手表上它只能说「去 iPhone 上登录」，所以不单独上手表商店
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Watch.entitlements
        CURRENT_PROJECT_VERSION: "6"
    scheme: {}
  # 表盘复杂功能：下一节课（圆形 = 今天进度环 + 下一节时间，矩形 = 时间 / 学员 / 地点 / 剩几节，顶部一行，四角）。
  # 读手表 app 写进手表本机钥匙串的快照（Watch/SnapshotStore.swift），自己不联网。
  FitCoachWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    # ⚠ xcodegen 的 info.path 是**生成目标**：内容写在 properties 里，那个文件由 xcodegen 生成（.gitignore 已排除）。
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: 上门体育
        # 扩展版本必须与主 App 一致（App Store 拒收不一致的包）；不写时 xcodegen 默认填 1.0。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: WatchWidget
        excludes: ["Info.plist"]
      - path: Sources/WatchSnapshot.swift
      - path: Sources/TimeKit.swift
      - path: Watch/SnapshotStore.swift
      - path: Watch/ComplicationViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.fitcoachapp.watchkitapp.widget
        CODE_SIGN_ENTITLEMENTS: WatchWidget.entitlements
        CURRENT_PROJECT_VERSION: "6"
